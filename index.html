<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Bilancio 50/30/20</title>
    <style>
        :root {
            --bg-color: #fce4ec;
            --card-bg: #ffffff;
            --primary-color: #e91e63;
            --primary-hover: #c2185b;
            --text-color: #4a4a4a;
            --border-color: #f8bbd0;
            --necessita-color: #ec407a;
            --svago-color: #ab47bc;
            --risparmi-color: #26a69a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 12px rgba(233, 30, 99, 0.1);
            border: 1px solid var(--border-color);
        }

        h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.9em;
            font-weight: 600;
        }

        input, select, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 1em;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .stat-box {
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            background-color: #fff0f5;
            font-size: 0.85em;
        }

        .stat-box.necessita { border-left: 4px solid var(--necessita-color); }
        .stat-box.svago { border-left: 4px solid var(--svago-color); }
        .stat-box.risparmi { border-left: 4px solid var(--risparmi-color); }

        .stat-box div {
            margin-top: 4px;
            font-weight: bold;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #f8bbd0;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .badge {
            font-size: 0.75em;
            padding: 3px 8px;
            border-radius: 12px;
            color: white;
            text-transform: capitalize;
        }

        .badge.necessità { background-color: var(--necessita-color); }
        .badge.svago { background-color: var(--svago-color); }
        .badge.risparmi { background-color: var(--risparmi-color); }

        .entrata { color: #2e7d32; font-weight: bold; }
        .uscita { color: #c62828; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">

    <!-- Sezione Inserimento Entrate -->
    <div class="card">
        <h2>Entrata Mensile</h2>
        <div class="form-group">
            <label for="stipendio">Importo Entrata Total (€):</label>
            <input type="number" id="stipendio" placeholder="Es. 1500" oninput="calcolaRipartizione()">
        </div>
    </div>

    <!-- Sezione Consigli e Ripartizione 50/30/20 -->
    <div class="card">
        <h2>Consigli Ripartizione (50 / 30 / 20)</h2>
        <div class="stat-grid">
            <div class="stat-box necessita">
                <strong>Necessità (50%)</strong>
                <div>Budget: €<span id="budget-necessita">0.00</span></div>
                <div>Speso: €<span id="speso-necessita">0.00</span></div>
                <div>Restante: €<span id="restante-necessita">0.00</span></div>
            </div>
            <div class="stat-box svago">
                <strong>Svago (30%)</strong>
                <div>Budget: €<span id="budget-svago">0.00</span></div>
                <div>Speso: €<span id="speso-svago">0.00</span></div>
                <div>Restante: €<span id="restante-svago">0.00</span></div>
            </div>
            <div class="stat-box risparmi">
                <strong>Risparmi (20%)</strong>
                <div>Budget: €<span id="budget-risparmi">0.00</span></div>
                <div>Speso: €<span id="speso-risparmi">0.00</span></div>
                <div>Restante: €<span id="restante-risparmi">0.00</span></div>
            </div>
        </div>
    </div>

    <!-- Sezione Aggiungi Operazione -->
    <div class="card">
        <h2>Aggiungi Operazione</h2>
        <div class="form-group">
            <label for="descrizione">Descrizione:</label>
            <input type="text" id="descrizione" placeholder="Es. Spesa alimentari">
        </div>
        <div class="form-group">
            <label for="importo">Importo (€):</label>
            <input type="number" id="importo" placeholder="Es. 45.00">
        </div>
        <div class="form-group">
            <label for="tipo">Tipo Movimento:</label>
            <select id="tipo">
                <option value="uscita">Uscita (Spesa)</option>
                <option value="entrata">Entrata</option>
            </select>
        </div>
        <div class="form-group">
            <label for="categoria">Ripartizione / Destinazione:</label>
            <select id="categoria">
                <option value="necessità">Necessità (50%)</option>
                <option value="svago">Svago (30%)</option>
                <option value="risparmi">Risparmi (20%)</option>
            </select>
        </div>
        <button onclick="aggiungiOperazione()">Aggiungi Operazione</button>
    </div>

    <!-- Lista Operazioni -->
    <div class="card">
        <h2>Storico Movimenti</h2>
        <div id="lista-operazioni"></div>
    </div>

</div>

<script>
    let operazioni = JSON.parse(localStorage.getItem('operazioni_503020')) || [];

    function salvaEDisegna() {
        localStorage.setItem('operazioni_503020', JSON.stringify(operazioni));
        calcolaRipartizione();
        aggiornaLista();
    }

    function aggiungiOperazione() {
        const desc = document.getElementById('descrizione').value.trim();
        const importo = parseFloat(document.getElementById('importo').value);
        const tipo = document.getElementById('tipo').value;
        const categoria = document.getElementById('categoria').value;

        if (!desc || isNaN(importo) || importo <= 0) {
            alert("Inserisci una descrizione valida e un importo maggiore di 0.");
            return;
        }

        const nuovaOp = {
            id: Date.now(),
            descrizione: desc,
            importo: importo,
            tipo: tipo,
            categoria: categoria
        };

        operazioni.push(nuovaOp);
        salvaEDisegna();

        document.getElementById('descrizione').value = '';
        document.getElementById('importo').value = '';
    }

    function calcolaRipartizione() {
        const stipendio = parseFloat(document.getElementById('stipendio').value) || 0;

        const budgetNecessita = stipendio * 0.50;
        const budgetSvago = stipendio * 0.30;
        const budgetRisparmi = stipendio * 0.20;

        let spesoNecessita = 0;
        let spesoSvago = 0;
        let spesoRisparmi = 0;

        operazioni.forEach(op => {
            if (op.tipo === 'uscita') {
                if (op.categoria === 'necessità') spesoNecessita += op.importo;
                if (op.categoria === 'svago') spesoSvago += op.importo;
                if (op.categoria === 'risparmi') spesoRisparmi += op.importo;
            }
        });

        document.getElementById('budget-necessita').innerText = budgetNecessita.toFixed(2);
        document.getElementById('speso-necessita').innerText = spesoNecessita.toFixed(2);
        document.getElementById('restante-necessita').innerText = (budgetNecessita - spesoNecessita).toFixed(2);

        document.getElementById('budget-svago').innerText = budgetSvago.toFixed(2);
        document.getElementById('speso-svago').innerText = spesoSvago.toFixed(2);
        document.getElementById('restante-svago').innerText = (budgetSvago - spesoSvago).toFixed(2);

        document.getElementById('budget-risparmi').innerText = budgetRisparmi.toFixed(2);
        document.getElementById('speso-risparmi').innerText = spesoRisparmi.toFixed(2);
        document.getElementById('restante-risparmi').innerText = (budgetRisparmi - spesoRisparmi).toFixed(2);
    }

    function aggiornaLista() {
        const container = document.getElementById('lista-operazioni');
        container.innerHTML = '';

        if (operazioni.length === 0) {
            container.innerHTML = '<p style="text-align:center; color: #888;">Nessun movimento inserito.</p>';
            return;
        }

        operazioni.slice().reverse().forEach(op => {
            const item = document.createElement('div');
            item.className = 'transaction-item';

            const segno = op.tipo === 'entrata' ? '+' : '-';
            const classeColore = op.tipo === 'entrata' ? 'entrata' : 'uscita';

            item.innerHTML = `
                <div>
                    <strong>${op.descrizione}</strong> 
                    <span class="badge ${op.categoria}">${op.categoria}</span>
                </div>
                <div class="${classeColore}">
                    ${segno} €${op.importo.toFixed(2)}
                </div>
            `;
            container.appendChild(item);
        });
    }

    // Inizializzazione
    calcolaRipartizione();
    aggiornaLista();
</script>

</body>
</html>
