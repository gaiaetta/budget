<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Budget</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .block { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        label { display: block; margin-top: 10px; }
        input, select, button { margin-top: 5px; padding: 8px; width: 100%; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #218838; }
        .grid { display: flex; gap: 10px; }
        .grid > div { flex: 1; border: 1px solid #ddd; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>Aggiungi Operazione</h2>
    <div class="block">
        <label for="descrizione">Descrizione:</label>
        <input type="text" id="descrizione" placeholder="Es. Spesa, Stipendio...">

        <label for="importo">Importo (€):</label>
        <input type="number" id="importo" placeholder="Es. 50 o -50">

        <label for="categoria">Categoria Destinazione:</label>
        <select id="categoria">
            <option value="necessita">Necessità (50%)</option>
            <option value="svago">Svago (30%)</option>
            <option value="risparmi">Risparmi (20%)</option>
        </select>

        <button onclick="aggiungiOperazione()">Aggiungi</button>
    </div>

    <h2>Consigli Ripartizione (50/30/20)</h2>
    <div class="block">
        <label for="entrateTotali">Inserisci Entrata Totale (€):</label>
        <input type="number" id="entrateTotali" placeholder="Es. 1500" oninput="calcolaRipartizione()">

        <div class="grid" style="margin-top: 15px;">
            <div>
                <strong>Necessità (50%)</strong>
                <p>Budget: €<span id="budget-necessita">0</span></p>
                <p>Spesi: €<span id="spesi-necessita">0</span></p>
                <p>Rimanenti: €<span id="restanti-necessita">0</span></p>
            </div>
            <div>
                <strong>Svago (30%)</strong>
                <p>Budget: €<span id="budget-svago">0</span></p>
                <p>Spesi: €<span id="spesi-svago">0</span></p>
                <p>Rimanenti: €<span id="restanti-svago">0</span></p>
            </div>
            <div>
                <strong>Risparmi (20%)</strong>
                <p>Budget: €<span id="budget-risparmi">0</span></p>
                <p>Spesi: €<span id="spesi-risparmi">0</span></p>
                <p>Rimanenti: €<span id="restanti-risparmi">0</span></p>
            </div>
        </div>
    </div>

    <h2>Storico Operazioni</h2>
    <ul id="listaOperazioni"></ul>

    <script>
        let operazioni = [];

        function aggiungiOperazione() {
            const desc = document.getElementById('descrizione').value;
            const imp = parseFloat(document.getElementById('importo').value);
            const cat = document.getElementById('categoria').value;

            if (!desc || isNaN(imp)) return;

            operazioni.push({ descrizione: desc, importo: imp, categoria: cat });
            
            document.getElementById('descrizione').value = '';
            document.getElementById('importo').value = '';

            aggiornaLista();
            calcolaRipartizione();
        }

        function aggiornaLista() {
            const lista = document.getElementById('listaOperazioni');
            lista.innerHTML = '';
            operazioni.forEach(op => {
                const li = document.createElement('li');
                li.textContent = `${op.descrizione}: €${op.importo} [${op.categoria}]`;
                lista.appendChild(li);
            });
        }

        function calcolaRipartizione() {
            const totale = parseFloat(document.getElementById('entrateTotali').value) || 0;

            const bNecessita = totale * 0.50;
            const bSvago = totale * 0.30;
            const bRisparmi = totale * 0.20;

            let sNecessita = 0;
            let sSvago = 0;
            let sRisparmi = 0;

            operazioni.forEach(op => {
                const valore = Math.abs(op.importo);
                if (op.categoria === 'necessita') sNecessita += valore;
                if (op.categoria === 'svago') sSvago += valore;
                if (op.categoria === 'risparmi') sRisparmi += valore;
            });

            document.getElementById('budget-necessita').textContent = bNecessita.toFixed(2);
            document.getElementById('spesi-necessita').textContent = sNecessita.toFixed(2);
            document.getElementById('restanti-necessita').textContent = (bNecessita - sNecessita).toFixed(2);

            document.getElementById('budget-svago').textContent = bSvago.toFixed(2);
            document.getElementById('spesi-svago').textContent = sSvago.toFixed(2);
            document.getElementById('restanti-svago').textContent = (bSvago - sSvago).toFixed(2);

            document.getElementById('budget-risparmi').textContent = bRisparmi.toFixed(2);
            document.getElementById('spesi-risparmi').textContent = sRisparmi.toFixed(2);
            document.getElementById('restanti-risparmi').textContent = (bRisparmi - sRisparmi).toFixed(2);
        }
    </script>
</body>
</html>
