<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestione Stipendio</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Libreria per la generazione del PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-color: #f7f5f7;
            --card-bg: #ffffff;
            --primary: #d8819d;
            --primary-hover: #c46b87;
            --primary-light: #fbebf0;
            --text-dark: #332e34;
            --text-muted: #7e737f;
            --border-color: #eee6ec;
            --accent-green: #68b087;
            --accent-red: #e06d7d;
            --shadow: 0 4px 15px rgba(180, 140, 160, 0.08);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding: 8px 4px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 span {
            color: var(--primary);
        }

        /* Period Selector Card */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .period-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .btn-nav {
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-nav:active {
            transform: scale(0.96);
            background: var(--primary);
            color: white;
        }

        .period-title {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .period-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 2px;
        }

        /* Summary Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .stat-card.full {
            grid-column: span 2;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
        }

        .stat-card.entrate::before { background-color: var(--accent-green); }
        .stat-card.uscite::before { background-color: var(--accent-red); }
        .stat-card.saldo::before { background-color: var(--primary); }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* Chart & Budget */
        .chart-container {
            position: relative;
            height: 220px;
            width: 100%;
            margin: 10px 0;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-dark);
        }

        .btn-pdf {
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-pdf:active {
            background: var(--primary);
            color: white;
        }

        /* Forms & Tabs */
        .tab-buttons {
            display: flex;
            background: #ede6eb;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 14px;
        }

        .tab-btn {
            flex: 1;
            border: none;
            padding: 10px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: #faf7f9;
            color: var(--text-dark);
            transition: border 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: #fff;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 12px rgba(216, 129, 157, 0.3);
            transition: background 0.2s;
        }

        .btn-submit:active {
            background: var(--primary-hover);
            transform: scale(0.99);
        }

        /* Movement List */
        .movement-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .movement-item:last-child {
            border-bottom: none;
        }

        .movement-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .movement-cat {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .movement-sub {
            font-size: 12px;
            color: var(--text-muted);
        }

        .movement-amount {
            font-size: 15px;
            font-weight: 700;
            text-align: right;
        }

        .amount-entrata { color: var(--accent-green); }
        .amount-uscita { color: var(--accent-red); }

        .btn-delete {
            background: none;
            border: none;
            color: #ccc;
            font-size: 16px;
            margin-left: 10px;
            cursor: pointer;
            padding: 4px;
        }

        .btn-delete:hover {
            color: var(--accent-red);
        }

        /* Category Manager List */
        .category-list-box {
            margin-top: 14px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .category-item {
            background: #faf7f9;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-dark);
        }

        .subcat-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .subcat-tag {
            background: #ede6eb;
            color: var(--text-dark);
            font-size: 11px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 8px;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div id="exportArea">
        <!-- Header -->
        <div class="header">
            <h1>🌸 Gestione <span>Stipendio</span></h1>
        </div>

        <!-- Period Card -->
        <div class="card">
            <div class="period-nav">
                <button class="btn-nav" data-html2canvas-ignore="true" onclick="changePeriod(-1)">❮ Prec</button>
                <div>
                    <div class="period-title" id="periodDisplay">--</div>
                    <div class="period-subtitle" id="periodSubDisplay">Mese Corrente</div>
                </div>
                <button class="btn-nav" data-html2canvas-ignore="true" onclick="changePeriod(1)">Succ ❯</button>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card entrate">
                <div class="stat-label">Entrate</div>
                <div class="stat-value" id="totalEntrate">€ 0.00</div>
            </div>
            <div class="stat-card uscite">
                <div class="stat-label">Uscite</div>
                <div class="stat-value" id="totalUscite">€ 0.00</div>
            </div>
            <div class="stat-card saldo full">
                <div class="stat-label">Saldo Mese</div>
                <div class="stat-value" id="totalSaldo">€ 0.00</div>
            </div>
        </div>

        <!-- Chart -->
        <div class="card">
            <div class="section-title">
                <span>📈 Uscite per Categoria</span>
                <button class="btn-pdf" data-html2canvas-ignore="true" onclick="exportPDF()">📄 Esporta PDF</button>
            </div>
            <div class="chart-container">
                <canvas id="categoryChart"></canvas>
            </div>
        </div>

        <!-- Movement List -->
        <div class="card">
            <div class="section-title">📋 Movimenti del Mese</div>
            <div id="movementList"></div>
        </div>
    </div>

    <!-- Add Movement Form -->
    <div class="card">
        <div class="section-title">➕ Nuova Operazione</div>
        
        <div class="tab-buttons">
            <button class="tab-btn active" id="tabUscita" onclick="setType('uscita')">Uscita</button>
            <button class="tab-btn" id="tabEntrata" onclick="setType('entrata')">Entrata</button>
        </div>

        <form onsubmit="addMovement(event)">
            <div class="form-group">
                <label>Importo (€)</label>
                <input type="number" step="0.01" class="form-control" id="movAmount" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label>Categoria</label>
                <select class="form-control" id="movCategory" onchange="updateSubcategories()" required>
                </select>
            </div>

            <div class="form-group">
                <label>Sottocategoria</label>
                <select class="form-control" id="movSubcategory">
                </select>
            </div>

            <div class="form-group">
                <label>Note / Descrizione (opzionale)</label>
                <input type="text" class="form-control" id="movNote" placeholder="Es. Spesa conad, Benzina...">
            </div>

            <button type="submit" class="btn-submit">Salva Operazione</button>
        </form>
    </div>

    <!-- Category & Subcategory Management -->
    <div class="card">
        <div class="section-title">🏷️ Categorie & Sottocategorie</div>
        
        <form onsubmit="addNewCategory(event)" style="margin-bottom: 12px;">
            <div class="form-group">
                <label>Aggiungi Nuova Categoria (con Emoji)</label>
                <input type="text" class="form-control" id="newCatName" placeholder="Es. 🐶 Lulù oppure 🚗 Auto" required>
            </div>
            <button type="submit" class="btn-submit" style="background: #9a809e; padding: 10px;">+ Categoria</button>
        </form>

        <form onsubmit="addNewSubcategory(event)">
            <div class="form-group">
                <label>Aggiungi Sottocategoria a Categoria Esistente</label>
                <select class="form-control" id="parentCategorySelect" style="margin-bottom: 6px;"></select>
                <input type="text" class="form-control" id="newSubCatName" placeholder="Es. Veterinario, Cibo, Palestra..." required>
            </div>
            <button type="submit" class="btn-submit" style="background: #8b718f; padding: 10px;">+ Sottocategoria</button>
        </form>

        <!-- Existing Categories List -->
        <div class="category-list-box">
            <div class="section-title" style="font-size: 13px; margin-top: 4px;">📂 Categorie Presenti</div>
            <div id="existingCategoriesContainer"></div>
        </div>
    </div>

    <script>
        const defaultCategories = {
            "Lulù🐾": ["Toelettatura", "Cibo e snack", "Accessori"],
            "Salute💊": ["Medicine", "Psicologa", "Visite"],
            "Spesa🛒": [],
            "Cibo🍕": ["Pranzo lavoro"],
            "Trasporti🚗": ["Bus", "Benzina", "Assicurazione"],
            "Bellezza💆🏻‍♀️": ["Unghie", "Prodotti"],
            "Shopping🛍️": [],
            "Regali🎁": []
        };

        let currentPeriodOffset = 0;
        let currentType = 'uscita';
        let categories = {};
        let movements = [];
        let chartInstance = null;

        window.onload = function() {
            loadCategories();
            loadMovements();
            renderAll();
        };

        function loadCategories() {
            const saved = localStorage.getItem('gestione_stipendio_cats');
            if (saved) {
                categories = JSON.parse(saved);
            } else {
                categories = defaultCategories;
                saveCategories();
            }
        }

        function saveCategories() {
            localStorage.setItem('gestione_stipendio_cats', JSON.stringify(categories));
        }

        function loadMovements() {
            const saved = localStorage.getItem('gestione_stipendio_movs');
            if (saved) {
                movements = JSON.parse(saved);
            } else {
                movements = [];
            }
        }

        function saveMovements() {
            localStorage.setItem('gestione_stipendio_movs', JSON.stringify(movements));
        }

        function setType(type) {
            currentType = type;
            document.getElementById('tabUscita').classList.toggle('active', type === 'uscita');
            document.getElementById('tabEntrata').classList.toggle('active', type === 'entrata');
            updateCategoryDropdowns();
        }

        function getPeriodDates(offset) {
            const now = new Date();
            let year = now.getFullYear();
            let month = now.getMonth() + offset;

            let startDate = new Date(year, month, 10);
            let endDate = new Date(year, month + 1, 9, 23, 59, 59);

            return { startDate, endDate };
        }

        function formatPeriodTitle(offset) {
            const { startDate, endDate } = getPeriodDates(offset);
            const options = { day: 'numeric', month: 'short' };
            const startStr = startDate.toLocaleDateString('it-IT', options);
            const endStr = endDate.toLocaleDateString('it-IT', options);
            
            const monthName = endDate.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
            return {
                title: `${startStr} - ${endStr}`,
                subtitle: monthName.charAt(0).toUpperCase() + monthName.slice(1)
            };
        }

        function changePeriod(delta) {
            currentPeriodOffset += delta;
            renderAll();
        }

        function updateCategoryDropdowns() {
            const catSelect = document.getElementById('movCategory');
            const parentCatSelect = document.getElementById('parentCategorySelect');
            
            catSelect.innerHTML = '';
            parentCatSelect.innerHTML = '';

            Object.keys(categories).forEach(cat => {
                let opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                catSelect.appendChild(opt);

                let optParent = document.createElement('option');
                optParent.value = cat;
                optParent.textContent = cat;
                parentCatSelect.appendChild(optParent);
            });

            updateSubcategories();
            renderExistingCategoriesList();
        }

        function updateSubcategories() {
            const selectedCat = document.getElementById('movCategory').value;
            const subSelect = document.getElementById('movSubcategory');
            subSelect.innerHTML = '';

            if (selectedCat && categories[selectedCat]) {
                categories[selectedCat].forEach(sub => {
                    let opt = document.createElement('option');
                    opt.value = sub;
                    opt.textContent = sub;
                    subSelect.appendChild(opt);
                });
            }
        }

        function renderExistingCategoriesList() {
            const container = document.getElementById('existingCategoriesContainer');
            container.innerHTML = '';

            Object.keys(categories).forEach(cat => {
                const catItem = document.createElement('div');
                catItem.className = 'category-item';

                let subTags = categories[cat].map(sub => `<span class="subcat-tag">${sub}</span>`).join('');

                catItem.innerHTML = `
                    <div class="category-header">
                        <span>${cat}</span>
                        <button class="btn-delete" title="Elimina Categoria" onclick="deleteCategory('${cat.replace(/'/g, "\\'")}')">🗑️</button>
                    </div>
                    <div class="subcat-tags">
                        ${subTags.length > 0 ? subTags : '<span class="subcat-tag" style="background:#eee;">Nessuna sottocategoria</span>'}
                    </div>
                `;
                container.appendChild(catItem);
            });
        }

        function addNewCategory(e) {
            e.preventDefault();
            const input = document.getElementById('newCatName');
            const name = input.value.trim();
            if (name && !categories[name]) {
                categories[name] = [];
                saveCategories();
                input.value = '';
                updateCategoryDropdowns();
            }
        }

        function addNewSubcategory(e) {
            e.preventDefault();
            const parent = document.getElementById('parentCategorySelect').value;
            const input = document.getElementById('newSubCatName');
            const subName = input.value.trim();

            if (parent && subName && categories[parent]) {
                if (!categories[parent].includes(subName)) {
                    categories[parent].push(subName);
                    saveCategories();
                    input.value = '';
                    updateCategoryDropdowns();
                }
            }
        }

        function deleteCategory(catName) {
            if (confirm(`Vuoi davvero eliminare la categoria "${catName}"?`)) {
                delete categories[catName];
                saveCategories();
                updateCategoryDropdowns();
            }
        }

        function addMovement(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('movAmount').value);
            const category = document.getElementById('movCategory').value;
            const subcategory = document.getElementById('movSubcategory').value || '';
            const note = document.getElementById('movNote').value.trim();

            if (!amount || amount <= 0) return;

            const movement = {
                id: Date.now(),
                type: currentType,
                amount: amount,
                category: category,
                subcategory: subcategory,
                note: note,
                date: new Date().toISOString()
            };

            movements.push(movement);
            saveMovements();

            document.getElementById('movAmount').value = '';
            document.getElementById('movNote').value = '';

            renderAll();
        }

        function deleteMovement(id) {
            movements = movements.filter(m => m.id !== id);
            saveMovements();
            renderAll();
        }

        function renderAll() {
            const periodInfo = formatPeriodTitle(currentPeriodOffset);
            document.getElementById('periodDisplay').textContent = periodInfo.title;
            document.getElementById('periodSubDisplay').textContent = periodInfo.subtitle;

            const { startDate, endDate } = getPeriodDates(currentPeriodOffset);

            const periodMovements = movements.filter(m => {
                const mDate = new Date(m.date);
                return mDate >= startDate && mDate <= endDate;
            });

            let totEntrate = 0;
            let totUscite = 0;
            let catTotals = {};

            periodMovements.forEach(m => {
                if (m.type === 'entrata') {
                    totEntrate += m.amount;
                } else {
                    totUscite += m.amount;
                    catTotals[m.category] = (catTotals[m.category] || 0) + m.amount;
                }
            });

            const saldo = totEntrate - totUscite;

            document.getElementById('totalEntrate').textContent = `€ ${totEntrate.toFixed(2)}`;
            document.getElementById('totalUscite').textContent = `€ ${totUscite.toFixed(2)}`;
            document.getElementById('totalSaldo').textContent = `€ ${saldo.toFixed(2)}`;

            renderMovementsList(periodMovements);
            renderChart(catTotals);
            updateCategoryDropdowns();
        }

        function renderMovementsList(list) {
            const container = document.getElementById('movementList');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = '<div class="empty-msg">Nessun movimento in questo periodo.</div>';
                return;
            }

            const sorted = [...list].sort((a,b) => new Date(b.date) - new Date(a.date));

            sorted.forEach(m => {
                const item = document.createElement('div');
                item.className = 'movement-item';

                const isEntrata = m.type === 'entrata';
                const sign = isEntrata ? '+' : '-';
                const amountClass = isEntrata ? 'amount-entrata' : 'amount-uscita';

                let subText = m.subcategory;
                if (m.note) {
                    subText += (subText ? ' • ' : '') + m.note;
                }

                item.innerHTML = `
                    <div class="movement-info">
                        <div class="movement-cat">${m.category}</div>
                        <div class="movement-sub">${subText || 'Generale'}</div>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <div class="movement-amount ${amountClass}">${sign} € ${m.amount.toFixed(2)}</div>
                        <button class="btn-delete" data-html2canvas-ignore="true" onclick="deleteMovement(${m.id})">✕</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function renderChart(catTotals) {
            const ctx = document.getElementById('categoryChart').getContext('2d');

            const labels = Object.keys(catTotals);
            const data = Object.values(catTotals);

            if (chartInstance) {
                chartInstance.destroy();
            }

            if (data.length === 0) {
                ctx.clearRect(0, 0, 300, 300);
                return;
            }

            const pinkGreyPalette = [
                '#d8819d', '#b08ebb', '#9381a4', '#d09bb0', 
                '#e0a7b8', '#88748a', '#ba899b', '#aaa0ac'
            ];

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: pinkGreyPalette.slice(0, labels.length),
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 11 },
                                boxWidth: 12,
                                padding: 12
                            }
                        }
                    },
                    cutout: '65%'
                }
            });
        }

        // Funzione Esportazione PDF
        function exportPDF() {
            const element = document.getElementById('exportArea');
            const subTitle = document.getElementById('periodSubDisplay').textContent;
            
            const opt = {
                margin:       10,
                filename:     `Resoconto_${subTitle.replace(/\s+/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
